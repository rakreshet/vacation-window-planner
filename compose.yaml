services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vacation
      POSTGRES_USER: vacation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation -d vacation"]
      interval: 2s
      timeout: 2s
      retries: 20

  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vacation:${POSTGRES_PASSWORD}@db:5432/vacation
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vacation:${POSTGRES_PASSWORD}@db:5432/vacation
      RECOMMENDATION_EFFICIENCY_WEIGHT: ${RECOMMENDATION_EFFICIENCY_WEIGHT:-0.5}
      RECOMMENDATION_DURATION_WEIGHT: ${RECOMMENDATION_DURATION_WEIGHT:-0.3}
      RECOMMENDATION_LENGTH_FIT_WEIGHT: ${RECOMMENDATION_LENGTH_FIT_WEIGHT:-0.2}
      RECOMMENDATION_GENERATION_CAP: ${RECOMMENDATION_GENERATION_CAP:-5000}
      RECOMMENDATION_LENGTH_TOLERANCE_DAYS: ${RECOMMENDATION_LENGTH_TOLERANCE_DAYS:-2}
      RECOMMENDATION_NEAR_DUPLICATE_OVERLAP_RATIO: ${RECOMMENDATION_NEAR_DUPLICATE_OVERLAP_RATIO:-0.8}
      RECOMMENDATION_MATERIAL_SCORE_GAP: ${RECOMMENDATION_MATERIAL_SCORE_GAP:-5}
      RECOMMENDATION_DEFAULT_RESULT_COUNT: ${RECOMMENDATION_DEFAULT_RESULT_COUNT:-5}
      RECOMMENDATION_ENGINE_VERSION: ${RECOMMENDATION_ENGINE_VERSION:-phase0-v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-15173}:5173"

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: vacation_test
      POSTGRES_USER: vacation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation -d vacation_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  backend-test:
    build: ./backend
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://vacation:${POSTGRES_PASSWORD}@test-db:5432/vacation_test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["pytest", "-q"]

  frontend-test:
    build: ./frontend
    profiles: ["test"]
    command: ["npm", "test"]

volumes:
  postgres_data:
